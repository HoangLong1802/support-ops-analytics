name: MySQL Validation

on:
  push:
  workflow_dispatch:

jobs:
  mysql-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PWD: ci_only_password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Enable LOAD DATA LOCAL on the temporary server
        run: |
          mysql --version
          mysql -h 127.0.0.1 -u root -e "SELECT VERSION(); SET GLOBAL local_infile=1;"

      - name: Python tests (no MySQL)
        run: python -m unittest tests.test_mysql_runner

      - name: Run SQL scripts and reconcile with Python
        run: python src/run_mysql.py --database support_ops_verify_ci

      - name: Check validation results
        run: python tests/check_mysql_receipt.py

      - name: Upload SQL evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-validation-output
          path: output/mysql/

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v